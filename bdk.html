<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Example</title>
</head>
<body>
  <!-- Create a button with ID 'bdk2551' -->
  <button id="bdk2551">bdk 2551</button>

  <script>
    // Get the button element
    const button = document.getElementById('bdk2551');

    // Set the link URL
    const link = "https://1drv.ms/x/c/648EF3F42CA07E2F/IQAE-wOYSSprTb84_4u5sXZuAXcY4WRmeQSxD7p908WdZWM?e=rvPepf";

    // Add event listener to the button
    button.addEventListener('click', function() {
      // Open the link when the button is clicked
      window.open(link, "_blank");
    });
  </script>
</body>
</html>
