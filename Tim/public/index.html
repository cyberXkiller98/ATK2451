<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Супер Веб-Мессенджер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <!-- ========================================== -->
        <!-- 1. ЭКРАН АВТОРИЗАЦИИ И РЕГИСТРАЦИИ        -->
        <!-- ========================================== -->
        <div id="auth-screen" class="card">
            <h2 id="auth-title">Вход в чат</h2>
            
            <form id="auth-form">
                <div class="input-group hidden" id="nickname-group">
                    <label for="nickname">Никнейм:</label>
                    <input type="text" id="nickname" placeholder="Придумайте никнейм" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="auth-error" class="error-message hidden"></div>

                <button type="submit" id="auth-btn" class="btn btn-primary">Войти</button>
            </form>

            <div class="auth-toggle">
                <span id="toggle-text">Ещё нет аккаунта?</span>
                <button type="button" id="toggle-btn" class="btn-link">Зарегистрироваться</button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. ЭКРАН МЕССЕНДЖЕРА                       -->
        <!-- ========================================== -->
        <div id="chat-screen" class="chat-container hidden">
            
            <!-- Шапка с профилем и переключателем вкладок -->
            <header class="chat-header">
                <div class="user-info" id="my-profile-btn" title="Нажмите, чтобы изменить профиль">
                    <div class="avatar" id="user-avatar">U</div>
                    <div>
                        <h3 id="user-nickname">Пользователь</h3>
                        <span class="status-online">● онлайн</span>
                    </div>
                </div>

                <!-- Вкладки: Общий чат / Личные диалоги -->
                <div class="tabs">
                    <button id="tab-global" class="tab-btn active">Общий чат</button>
                    <button id="tab-private" class="tab-btn">
                        Личка <span id="unread-badge" class="badge hidden">0</span>
                    </button>
                </div>

                <button id="logout-btn" class="btn btn-secondary">Выйти</button>
            </header>

            <!-- ОБЛАСТЬ 1: ОБЩИЙ ГИГАЧАТ -->
            <div id="global-chat-view" class="chat-view">
                <div id="messages-container" class="messages-container"></div>

                <!-- Форма отправки сообщения -->
                <form id="message-form" class="message-form">
                    <!-- Загрузка картинок -->
                    <label for="image-input" class="icon-btn" title="Прикрепить фото">
                        📷
                    </label>
                    <input type="file" id="image-input" accept="image/*" hidden>

                    <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
                    
                    <button type="submit" id="send-btn" class="btn btn-primary icon-send">
                        <span>Отправить</span>
                    </button>
                </form>
                <div id="image-preview-container" class="image-preview-container hidden">
                    <span>Картинка прикреплена</span>
                    <button id="remove-image-btn" type="button">✖</button>
                </div>
            </div>

            <!-- ОБЛАСТЬ 2: СПИСОК ЛИЧНЫХ ДИАЛОГОВ -->
            <div id="private-chat-view" class="chat-view hidden">
                <div id="private-header" class="private-header hidden">
                    <button id="back-to-chats-btn" class="btn-link">← Все диалоги</button>
                    <h4 id="private-with-nickname">Чат с...</h4>
                </div>

                <div id="private-dialogs-list" class="dialogs-list">
                    <p class="empty-state">У вас пока нет личных сообщений. Нажмите на любого пользователя в общем чате, чтобы написать ему!</p>
                </div>

                <div id="private-messages-container" class="messages-container hidden"></div>

                <form id="private-message-form" class="message-form hidden">
                    <input type="text" id="private-message-input" placeholder="Личное сообщение..." autocomplete="off">
                    <button type="submit" id="private-send-btn" class="btn btn-primary">Отправить</button>
                </form>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- 3. МОДАЛЬНОЕ ОКНО ПРОФИЛЯ ПОЛЬЗОВАТЕЛЯ    -->
        <!-- ========================================== -->
        <div id="profile-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" id="close-modal-btn">✖</button>
                
                <div class="profile-card">
                    <div class="avatar-large" id="modal-avatar">U</div>
                    <h2 id="modal-nickname">Никнейм</h2>
                    <p id="modal-bio" class="modal-bio">О себе...</p>
                    <span id="modal-date" class="modal-date">Зарегистрирован: ...</span>

                    <!-- Редактирование (для себя) -->
                    <div id="edit-profile-section" class="hidden">
                        <input type="text" id="edit-avatar-url" placeholder="Ссылка на аватарку (URL)">
                        <textarea id="edit-bio" placeholder="Расскажите о себе..."></textarea>
                        <button id="save-profile-btn" class="btn btn-primary">Сохранить профиль</button>
                    </div>

                    <!-- Кнопка "Написать в личку" (для чужих) -->
                    <button id="start-private-btn" class="btn btn-primary hidden">💬 Написать в личку</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
