<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="auth-screen" class="auth-wrapper">
        <div class="auth-box">
            <div class="brand-badge">⚡ Web Messenger</div>
            <h2 id="auth-title">Вход в аккаунт</h2>
            
            <form id="auth-form">
                <div class="input-field hidden" id="nickname-group">
                    <label for="nickname">Никнейм</label>
                    <input type="text" id="nickname" placeholder="Ваш никнейм" autocomplete="off">
                </div>

                <div class="input-field">
                    <label for="email">Email адрес</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div id="auth-error" class="form-error hidden"></div>

                <button type="submit" id="auth-btn" class="btn btn-primary">Войти</button>
            </form>

            <div class="auth-footer">
                <span id="toggle-text">Ещё нет аккаунта?</span>
                <button type="button" id="toggle-btn" class="btn-text">Зарегистрироваться</button>
            </div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ИНТЕРФЕЙС ПРИЛОЖЕНИЯ -->
    <div id="app-screen" class="app-layout hidden">

        <!-- СИДЕБАР (БОКОВАЯ ПАНЕЛЬ) -->
        <aside class="sidebar">
            <div class="user-bar">
                <div class="user-preview" id="my-profile-trigger">
                    <div class="avatar" id="my-avatar">U</div>
                    <div class="user-meta">
                        <span id="my-nickname" class="nickname">Пользователь</span>
                        <span class="status-online">● онлайн</span>
                    </div>
                </div>
                <button id="logout-btn" class="btn-icon" title="Выйти">🚪</button>
            </div>

            <!-- Разделы чатов -->
            <div class="chat-sections">
                <div class="section-label">Главный канал</div>
                <div class="chat-card active" id="global-chat-card">
                    <div class="card-icon">🌐</div>
                    <div class="card-info">
                        <div class="card-title-row">
                            <span class="card-title">Общий чат</span>
                            <span class="card-time" id="global-time"></span>
                        </div>
                        <span class="card-preview" id="global-preview">Все пользователи</span>
                    </div>
                </div>

                <div class="section-label">Личные диалоги</div>
                <div class="direct-chats-list" id="direct-chats-list">
                    <!-- Диалоги динамически создаются здесь -->
                </div>
            </div>
        </aside>

        <!-- ГЛАВНАЯ ОБЛАСТЬ ЧАТА -->
        <main class="chat-workspace">
            <!-- Шапка чата -->
            <header class="workspace-header">
                <button id="back-to-sidebar-btn" class="btn-icon mobile-only">←</button>
                <div class="active-chat-info" id="active-chat-info">
                    <div class="avatar" id="header-avatar">🌐</div>
                    <div>
                        <h3 id="header-title">Общий чат</h3>
                        <span id="header-subtitle" class="subtitle">Публичная комната</span>
                    </div>
                </div>
            </header>

            <!-- Лента сообщений -->
            <div id="messages-container" class="messages-scroll-area"></div>

            <!-- Ввод сообщения -->
            <footer class="workspace-footer">
                <form id="message-form" class="send-form">
                    <label for="image-input" class="attach-btn" title="Прикрепить изображение">
                        📷
                    </label>
                    <input type="file" id="image-input" accept="image/*" hidden>

                    <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
                    
                    <button type="submit" id="send-btn" class="btn btn-primary btn-send">
                        <span>Отправить</span>
                    </button>
                </form>

                <div id="image-preview-bar" class="image-preview-bar hidden">
                    <span>🖼️ Фотография готова к отправке</span>
                    <button id="remove-image-btn" type="button">✖</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div id="profile-modal" class="modal-backdrop hidden">
        <div class="modal-window">
            <button class="modal-close-btn" id="close-modal-btn">✖</button>
            
            <div class="profile-summary">
                <div class="avatar-large" id="modal-avatar">U</div>
                <h3 id="modal-nickname">Никнейм</h3>
                <span id="modal-date" class="register-date">Зарегистрирован: ...</span>
            </div>

            <!-- Блок для просмотра О Себе -->
            <div class="bio-container">
                <label class="field-label">О себе:</label>
                <p id="modal-bio" class="bio-text">Пользователь пока ничего не указал.</p>
            </div>

            <!-- БЛОК 1: Тлько для РЕДАКТИРОВАНИЯ своего профиля -->
            <div id="edit-profile-block" class="modal-section hidden">
                <div class="input-field">
                    <label>Ссылка на аватарку (URL)</label>
                    <input type="text" id="edit-avatar-url" placeholder="https://site.com/avatar.jpg">
                </div>
                <div class="input-field">
                    <label>Статус / О себе</label>
                    <textarea id="edit-bio" placeholder="Напишите пару слов о себе..."></textarea>
                </div>
                <button id="save-profile-btn" class="btn btn-primary full-width">Сохранить изменения</button>
            </div>

            <!-- БЛОК 2: Только для НАЧАЛА ЛИЧКИ с чужим профилем -->
            <div id="action-profile-block" class="modal-section hidden">
                <button id="start-private-btn" class="btn btn-primary full-width">💬 Написать личное сообщение</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
