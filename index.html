<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAVA</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent1:#06b6d4; /* cyan-ish */
      --accent2:#f97316; /* orange */
      --text:#e6eef8;
      --muted:#9fb0c8;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #071023 0%, #0b1530 100%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;padding:32px;
    }
    .container{
      width:100%;max-width:980px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:20px;padding:36px;box-shadow:0 10px 30px rgba(2,6,23,0.6);
      display:grid;grid-template-columns:1fr;gap:20px;align-items:center;
    }
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;margin:0}
    p.lead{margin:0;color:var(--muted);font-size:13px}
    .buttons{
      display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:6px
    }
    .big-btn{
      --padY:32px;--padX:48px;
      display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
      text-decoration:none;border-radius:18px;padding:var(--padY) var(--padX);
      min-width:260px;min-height:120px;box-shadow:0 8px 20px rgba(2,6,23,0.6);
      transition:transform .16s ease,box-shadow .16s ease,opacity .12s ease;
      color:var(--text);background:linear-gradient(135deg,var(--card),var(--glass));
      border:1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
    }
    .big-btn:active{transform:translateY(2px)}
    .big-btn:focus{outline:3px solid rgba(8,145,178,0.18);outline-offset:4px}
    .big-btn .title{font-size:22px;font-weight:700;letter-spacing:0.4px}
    .big-btn .subtitle{font-size:13px;color:var(--muted);margin-top:6px}

    /* accents */
    .sys{background:linear-gradient(120deg,var(--accent1), #0ea5a8);}
    .java{background:linear-gradient(120deg,var(--accent2), #ffb86b);}

    /* responsive */
    @media (max-width:640px){
      .big-btn{min-width:100%;padding:22px 20px;min-height:84px}
      .container{padding:20px}
      h1{font-size:18px}
    }

    footer{display:flex;justify-content:center;color:var(--muted);font-size:12px;margin-top:8px}
  </style>
</head>
